name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CDC smoke test
        run: >-
          cdc-reconcile demo
          --workspace /tmp/cdc-demo
          --seed 20260728
          --entities 24
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cdc-evidence-${{ matrix.python-version }}
          path: |
            /tmp/cdc-demo/warehouse/_meta/run_manifest.json
            /tmp/cdc-demo/warehouse/_meta/reconciliation_report.json
            /tmp/cdc-demo/warehouse/quarantine/events.csv
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cdc-reconciliation:ci .
      - run: docker run --rm cdc-reconciliation:ci --help

